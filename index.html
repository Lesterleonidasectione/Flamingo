<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flamingo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #2a080c 0%, #0d0d0d 70%, #050505 100%);
            background-attachment: fixed;
            color: #f1f1f1;
            min-height: 100vh;
        }

        header {
            position: relative;
            width: 100%;
            max-height: 550px;
            overflow: hidden;
            border-bottom: 4px solid #991b1b;
            box-shadow: 0 4px 25px rgba(185, 28, 28, 0.4);
        }
        header img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
        }
        .header-overlay {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 10, 10, 0.9);
            backdrop-filter: blur(8px);
            padding: 15px 30px;
            border-radius: 40px;
            border: 1px solid rgba(220, 38, 38, 0.4);
            text-align: center;
            box-shadow: 0 0 20px rgba(185, 28, 28, 0.3);
            width: 90%;
            max-width: 500px;
        }
        .header-overlay h1 {
            color: #ffffff;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.6);
            margin: 0;
        }
        .header-overlay p {
            color: #fca5a5;
            font-size: 0.9rem;
            font-weight: 600;
            margin: 0;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 35px;
            color: #ffffff;
            position: relative;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #991b1b, #ef4444);
            margin: 12px auto 0;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        /* --- Shogun Trading Cards --- */
        .shogun-card {
            background: linear-gradient(145deg, #181112 0%, #0d0809 100%);
            border: 2px solid #7f1d1d !important;
            border-radius: 12px;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8), inset 0 0 12px rgba(185, 28, 28, 0.15);
            overflow: hidden;
            height: 100%;
        }
        .shogun-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #dc2626, #f59e0b, #dc2626, transparent);
        }
        .shogun-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #ef4444 !important;
            box-shadow: 0 12px 30px rgba(220, 38, 38, 0.4), inset 0 0 15px rgba(220, 38, 38, 0.25);
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #b91c1c 0%, #450a0a 100%);
            border: 3px solid #f59e0b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: #ffffff;
            margin: 0 auto 15px;
            box-shadow: 0 0 15px rgba(185, 28, 28, 0.6);
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .view-btn {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(185, 28, 28, 0.2);
            color: #fca5a5;
            border: 1px solid #dc2626;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .view-btn:hover {
            background: #dc2626;
            color: #ffffff;
            border-color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        }

        /* Modal Styles */
        .modal-content {
            background: linear-gradient(135deg, #1c1012 0%, #0d0809 100%);
            border: 2px solid #dc2626;
            border-radius: 16px;
            color: #f1f1f1;
            box-shadow: 0 0 40px rgba(185, 28, 28, 0.5);
        }
        .btn-close-white {
            filter: invert(1) grayscale(100%) brightness(200%);
        }
        
        .modal-bio-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #7f1d1d;
            border-radius: 8px;
            padding: 12px 15px;
            color: #e5e7eb;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .info-list {
            list-style: none;
            border-top: 1px solid #7f1d1d;
            padding-top: 15px;
        }
        .info-list li { margin-bottom: 8px; font-size: 0.9rem; }
        .info-list strong { color: #fca5a5; }

        footer {
            text-align: center;
            padding: 30px;
            background: #080405;
            border-top: 1px solid #2a080c;
            color: #7f1d1d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <img src="Trill.png" alt="Trillium in Shibuya Day Time Header">
        <div class="header-overlay">
            <h1>Flamingo Boyz</h1>
            <p>A Brotherly Bond — Nihonggo Edition</p>
        </div>
    </header>

    <main class="container my-5">
        <h2 class="section-title">Assembly Members</h2>
        
        <!-- Responsive Bootstrap Grid -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4" id="profileGrid"></div>
    </main>

    <!-- Bootstrap Modal for Card Detail View -->
    <div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="mName" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4 text-center">
                <div class="d-flex justify-content-end">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="avatar mx-auto mb-3" id="mAvatar"></div>
                    <h2 class="h3 text-white mb-1" id="mName"></h2>
                    <div class="mb-3 fw-bold" id="mRole" style="color: #fca5a5 !important;"></div>
                    
                    <!-- Formatted Bio Container -->
                    <p class="modal-bio-box text-start mb-3" id="mBio"></p>
                    
                    <ul class="info-list text-start ps-0">
                        <li><strong>Role / Title:</strong> <span id="mDetailRole"></span></li>
                        <li><strong>Affiliation:</strong> Lodger's Assembly - Shibuya Chapter</li>
                        <li><strong>Status:</strong> Active Member</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Lodger's Assembly. All rights reserved.
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const members = [
            { 
                id: 1, 
                name: "Lester Mark", 
                initials: "LMX", 
                role: "Data Scientist", 
                bio: "Master of computational intellect and data architecture. Lester analyzes complex patterns to formulate precise strategies for the assembly." 
            },
            { 
                id: 2, 
                name: "Lance Marion", 
                initials: "LMZ", 
                role: "Paralegal/Realtor", 
                bio: "Guardian of contracts and domain acquisitions. Lance navigates complex legal realms and secures valuable territories for the assembly's domain." 
            },
            { 
                id: 3, 
                name: "Paul Michael", 
                initials: "PT", 
                role: "PSW", 
                bio: "The compassionate defender. Dedicated to health, support, and protection, Paul ensures the vitality and resilience of all assembly allies." 
            },
            { 
                id: 4, 
                name: "Anthony", 
                initials: "A", 
                role: "AZ Driver", 
                bio: "Vanguard of logistics and heavy transport. Anthony commands the highways, delivering vital resources across distant frontiers without delay." 
            },
            { 
                id: 5, 
                name: "John Chadwick", 
                initials: "JC", 
                role: "CEO", 
                bio: "Supreme strategist and assembly commander. John steers the brotherhood's vision, steering long-term ambitions into decisive victories." 
            },
            { 
                id: 6, 
                name: "Sandrover", 
                initials: "S", 
                role: "Calligraphist", 
                bio: "Artisan of sacred scripts and refined aesthetics. Sandrover preserves the assembly’s legacy and culture through meticulous brushwork and design." 
            },
            { 
                id: 7, 
                name: "Emerson", 
                initials: "E", 
                role: "Operation Manager", 
                bio: "Architect of tactical execution. Emerson coordinates day-to-day maneuvers, optimizing efficiency across every sector of the assembly." 
            },
            { 
                id: 8, 
                name: "Paul", 
                initials: "P", 
                role: "Police", 
                bio: "Enforcer of discipline and order. Paul stands watch over the assembly's perimeter, upholding justice and safeguarding the brotherhood." 
            }
        ];

        const grid = document.getElementById('profileGrid');
        let profileModal;

        document.addEventListener('DOMContentLoaded', () => {
            profileModal = new bootstrap.Modal(document.getElementById('profileModal'));

            members.forEach(m => {
                const col = document.createElement('div');
                col.className = 'col';
                col.innerHTML = `
                    <div class="card shogun-card text-center p-3" onclick="openModal(${m.id})">
                        <div class="avatar">${m.initials}</div>
                        <h3 class="h5 text-white mb-1">${m.name}</h3>
                        <p class="small mb-3" style="color: #fca5a5;">${m.role}</p>
                        <div class="mt-auto">
                            <a href="javascript:void(0)" class="view-btn">View Profile</a>
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });
        });

        function openModal(id) {
            const m = members.find(item => item.id === id);
            if (!m) return;

            document.getElementById('mAvatar').textContent = m.initials;
            document.getElementById('mName').textContent = m.name;
            document.getElementById('mRole').textContent = m.role;
            document.getElementById('mBio').textContent = m.bio;
            document.getElementById('mDetailRole').textContent = m.role;
            
            profileModal.show();
        }
    </script>
</body>
</html>
